<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CNC · FMEA 3D</title>
<style>#pn{max-height:55vh;overflow:auto}#pn button{margin-top:6px}#ed{position:fixed;inset:0;background:#15181cf7;overflow:auto;padding:14px;display:none;z-index:8}#ed label{display:block;margin:8px 0;font-size:12px}#ed input,#ed textarea,#ed select{width:100%;box-sizing:border-box;background:#232a31;color:#e8eaed;border:1px solid #3a444e;border-radius:8px;padding:8px;font:inherit}#ed textarea{min-height:54px}#ed button{margin:8px 8px 20px 0}#ov *{pointer-events:auto}#ov #ch{pointer-events:none}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#15181c;color:#e8eaed;font:14px system-ui,sans-serif;overflow:hidden}
canvas{display:block;touch-action:none}
#bar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button{background:#232a31e6;color:#e8eaed;border:1px solid #3a444e;border-radius:10px;padding:9px 12px;font:inherit}
#lg{height:10px;flex:1;min-width:90px;border-radius:5px;background:linear-gradient(90deg,hsl(118,85%,45%),hsl(60,85%,45%),hsl(0,85%,45%))}
#lt{font-size:11px;opacity:.7;width:100%;display:flex;justify-content:space-between}
#pn{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);background:#1d2329f2;border:1px solid #3a444e;border-radius:14px;padding:12px 14px;display:none;max-width:480px}
#pn h3{margin:0 0 6px;font-size:16px}.b{display:inline-block;padding:2px 8px;border-radius:8px;margin:0 4px 6px 0;background:#2e3841;font-size:12px}
.bar{height:8px;background:#2e3841;border-radius:4px;overflow:hidden;margin:4px 0 8px}.bar i{display:block;height:100%}
#tt{position:fixed;top:92px;left:50%;transform:translateX(-50%);background:#000a;padding:6px 12px;border-radius:10px;display:none}
</style></head><body>
<div id="ov" style="position:fixed;inset:0;pointer-events:none"><div id="bar"><button id="m">Modo: Severidade</button><button id="r">Recolocar tampas</button><button id="ar" style="display:none">Ver em AR</button><select id="ms" style="background:#232a31;color:#e8eaed;border-radius:10px;padding:9px"></select><button id="imp">Importar máquina</button><button id="exp">Exportar JSON</button><button id="dbg">Peças</button><input id="fi" type="file" accept=".glb" style="display:none"><label id="sc" style="display:none">Comprimento (m) <input id="len" type="number" value="2.8" step="0.1" min="0.1" style="width:60px"></label><button id="tc" style="display:none">Tirar tampa (mira)</button><div id="lg"></div>
<div id="lt"><span>S1 baixo</span><span>FMEA de exemplo (dados fictícios)</span><span>S10 crítico</span></div></div>
<div id="ch" style="display:none;position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px;border:2px solid #fff;border-radius:50%;pointer-events:none"></div><div id="ld" style="position:fixed;inset:0;display:grid;place-items:center;background:#15181c;z-index:9">Carregando modelo…</div><div id="tt"></div><div id="pn"></div><div id="ed"></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const T=THREE;
const R=new T.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);
R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=.85;R.outputEncoding=T.sRGBEncoding;
document.body.appendChild(R.domElement);
const S=new T.Scene();S.background=new T.Color(0x15181c);S.fog=new T.Fog(0x15181c,14,32);
const C=new T.PerspectiveCamera(45,innerWidth/innerHeight,.02,30);C.position.set(3.6,2.5,5.2);
const O=new T.OrbitControls(C,R.domElement);O.target.set(0,1.3,0);O.enableDamping=true;O.minDistance=.4;O.maxDistance=14;O.maxPolarAngle=1.5;
// ambiente de estúdio (reflexos metálicos)
const es=new T.Scene();es.add(new T.Mesh(new T.BoxGeometry(20,10,20),new T.MeshBasicMaterial({color:0x56606a,side:T.BackSide})));
[[0,4.8,0,'x',Math.PI/2],[-9,2,0,'y',Math.PI/2],[9,2,0,'y',-Math.PI/2],[0,2,9,'y',Math.PI]].forEach(a=>{const p=new T.Mesh(new T.PlaneGeometry(8,5),new T.MeshBasicMaterial({color:new T.Color().setScalar(5)}));p.position.set(a[0],a[1],a[2]);p.rotation[a[3]]=a[4];es.add(p)});
S.environment=new T.PMREMGenerator(R).fromScene(es,.03).texture;
S.add(new T.HemisphereLight(0xffffff,0x222222,.25));
const D=new T.DirectionalLight(0xffffff,1.2);D.position.set(4,8,6);D.castShadow=true;D.shadow.mapSize.set(2048,2048);
Object.assign(D.shadow.camera,{left:-4,right:4,top:4,bottom:-4,far:24});D.shadow.bias=-.0004;S.add(D);
const fl=new T.Mesh(new T.PlaneGeometry(20,20),new T.MeshStandardMaterial({color:0x2a2e33,roughness:.85,metalness:.1}));fl.material.envMapIntensity=.25;fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;S.add(fl);
// materiais
const M=(c,m,r)=>new T.MeshStandardMaterial({color:c,metalness:m,roughness:r});
const paint=M(0x3f6b5c,.3,.4),iron=M(0x4a4e52,.85,.4),steel=M(0xc4c8cc,1,.2),rub=M(0x0e0e0e,.1,.9);
const glass=new T.MeshStandardMaterial({color:0x9fc4d6,transparent:true,opacity:.35,metalness:0,roughness:.08,side:T.DoubleSide,depthWrite:false});
const bx=(w,h,d,m,x=0,y=0,z=0)=>{const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);return o};
const cy=(r,l,m,x=0,y=0,z=0,ax='x',r2=r)=>{const g=new T.CylinderGeometry(r2,r,l,40);if(ax=='x')g.rotateZ(Math.PI/2);if(ax=='z')g.rotateX(Math.PI/2);const o=new T.Mesh(g,m);o.position.set(x,y,z);return o};
const parts={},root=new T.Group();S.add(root);
const P=(id,cover,...ms)=>{const g=new T.Group();ms.forEach(m=>g.add(m));g.userData={id,cover};
 g.traverse(o=>{if(o.isMesh){o.castShadow=o.material!==glass;o.receiveShadow=true;o.material=o.userData.m0=o.material.clone()}});root.add(g);parts[id]=g};
// FMEA exemplo: id|nome|S|O|D|vida h|usado h|vence|nota
let F={};
const sevC=s=>new T.Color().setHSL((1-(s-1)/9)*.33,.85,.45);
let sev=true,sel=null,pin=false;
function paintAll(){for(const id in parts){const g=parts[id],f=F[id];g.traverse(o=>{if(!o.isMesh)return;
 o.material=sev?(o.userData.ms||(o.userData.ms=new T.MeshStandardMaterial({color:sevC(f.S),metalness:.35,roughness:.45,envMapIntensity:.45,transparent:o.userData.m0.transparent,opacity:o.userData.m0.opacity,side:o.userData.m0.side,depthWrite:o.userData.m0.depthWrite}))):o.userData.m0;
 o.material.emissive&&o.material.emissive.setScalar(id==sel?.22:0)})}}
paintAll();
m.onclick=()=>{sev=!sev;m.textContent='Modo: '+(sev?'Severidade':'Realista');paintAll()};
const hid=[];r.onclick=()=>{hid.forEach(g=>g.visible=true);hid.length=0};
const pn=document.getElementById('pn'),tt=document.getElementById('tt');
function show(id){sel=id;paintAll();if(!id){pn.style.display='none';return}
 const f=F[id],rpn=f.S*f.O*f.D,pc=Math.min(100,Math.round(f.u/f.v*100)),dias=Math.ceil((new Date(f.d)-Date.now())/864e5);
 const col=sevC(f.S).getStyle(),dc=dias<60?'#ff6b5e':dias<180?'#f2c94c':'#7bd88f';
 pn.innerHTML=`<h3>${f.n}</h3><span class="b" style="background:${col};color:#111">Severidade ${f.S}</span><span class="b">Ocorrência ${f.O}</span><span class="b">Detecção ${f.D}</span><span class="b">RPN ${rpn}</span>
 <div>Vida útil: ${f.u} de ${f.v} h (${pc}%)</div><div class="bar"><i style="width:${pc}%;background:${pc>85?'#ff6b5e':pc>65?'#f2c94c':'#7bd88f'}"></i></div>
 <div>Vencimento: <b style="color:${dc}">${f.d.split('-').reverse().join('/')}</b> (${dias>0?dias+' dias':'vencido'})</div><div style="opacity:.8;margin-top:4px">${f.t}</div>${ext(f.p)}<button id="eb">Editar peça</button>`;pn.style.display='block';eb.onclick=()=>edit(id)}
const rc=new T.Raycaster(),V=new T.Vector2();
const pick=(x,y)=>{V.set(x,y);rc.setFromCamera(V,C);const h=rc.intersectObjects(Object.values(parts).filter(p=>p.visible),true)[0];if(!h)return null;let o=h.object;while(!o.userData.id)o=o.parent;return{g:o,p:h.point}};
let d0;const goal=O.target.clone();
R.domElement.addEventListener('pointerdown',e=>d0={x:e.clientX,y:e.clientY,t:Date.now()});
R.domElement.addEventListener('pointerup',e=>{if(!d0||Math.hypot(e.clientX-d0.x,e.clientY-d0.y)>6||Date.now()-d0.t>350)return;
 const h=pick(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);if(!h){pin=false;show(null);return}
 if(h.g.userData.cover){h.g.visible=false;hid.push(h.g);tt.textContent=F[h.g.userData.id].n+' removida. Toque em "Recolocar tampas".';tt.style.display='block';setTimeout(()=>tt.style.display='none',2500);return}
 pin=true;goal.copy(h.p);show(h.g.userData.id)});
let tk=0,xs=null,hs=null,placed=false;
const ret=new T.Mesh(new T.RingGeometry(.12,.15,32).rotateX(-Math.PI/2),new T.MeshBasicMaterial({color:0xffffff}));ret.matrixAutoUpdate=false;ret.visible=false;S.add(ret);
const sh=new T.Mesh(new T.PlaneGeometry(10,10).rotateX(-Math.PI/2),new T.ShadowMaterial({opacity:.35}));sh.receiveShadow=true;sh.visible=false;S.add(sh);S.add(D.target);
if(navigator.xr)navigator.xr.isSessionSupported('immersive-ar').then(ok=>{if(ok){ar.style.display='';sc.style.display=''}}).catch(()=>{});
ar.onclick=async()=>{if(xs)return;try{xs=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay'],domOverlay:{root:document.getElementById('ov')}})}catch(e){alert('AR indisponível aqui. Abra o arquivo em HTTPS no Chrome do Android.');return}
 R.xr.enabled=true;R.xr.setReferenceSpaceType('local');await R.xr.setSession(xs);document.documentElement.style.background=document.body.style.background='transparent';S.background=null;S.fog=null;fl.visible=false;root.visible=false;placed=false;tc.style.display=ch.style.display='';
 hs=await xs.requestHitTestSource({space:await xs.requestReferenceSpace('viewer')});
 xs.addEventListener('select',()=>{if(ret.visible&&!placed){root.position.setFromMatrixPosition(ret.matrix);root.scale.setScalar(len.value/2.8);root.visible=true;placed=true;ret.visible=false;sh.position.copy(root.position);D.target.position.copy(root.position);D.position.copy(root.position).add(new T.Vector3(4,8,6));sh.visible=true}});
 xs.addEventListener('end',()=>{R.xr.enabled=false;xs=hs=null;document.documentElement.style.background=document.body.style.background='#15181c';S.background=new T.Color(0x15181c);S.fog=new T.Fog(0x15181c,14,32);fl.visible=true;sh.visible=false;root.visible=true;root.scale.setScalar(1);root.position.set(0,0,0);D.target.position.set(0,0,0);D.position.set(4,8,6);tc.style.display=ch.style.display='none';ret.visible=false;C.position.set(3.6,2.5,5.2)})};
[bar,pn,tt].forEach(el=>el.addEventListener('beforexrselect',e=>e.preventDefault()));tc.onclick=()=>{const h=pick(0,0);if(h&&h.g.userData.cover){h.g.visible=false;hid.push(h.g)}};
R.setAnimationLoop((t,f)=>{if(!xs){O.target.lerp(goal,.12);O.update()}
 if(f&&hs&&!placed){const h=f.getHitTestResults(hs)[0];if(h){ret.visible=true;ret.matrix.fromArray(h.getPose(R.xr.getReferenceSpace()).transform.matrix)}else ret.visible=false}
 if(++tk%8==0){const dist=xs?(placed?C.getWorldPosition(new T.Vector3()).distanceTo(root.position):9):C.position.distanceTo(O.target);
  if(dist<(xs?2.4:2.3)){const h=pick(0,0);if(h&&h.g.userData.id!==sel&&!h.g.userData.cover){pin=false;show(h.g.userData.id)}}else if(!pin&&sel)show(null)}
 R.render(S,C)});
const mdl=new T.Group();mdl.position.set(.286,.129,-.381);root.add(mdl);
const MID=new URLSearchParams(location.search).get('m')||'cnc-01';
async function init(){try{CUR=await getM(MID);const j=CUR.j;
 j.pecas.forEach(p=>{F[p.mesh]={n:p.nome,S:p.severidade,O:p.ocorrencia,D:p.deteccao,v:p.vida_h,u:p.usado_h,d:p.vencimento,t:p.nota,c:p.tipo=='cover'?1:0,p}});
 document.getElementById('lt').children[1].textContent=j.maquina.dados_ficticios?'FMEA de exemplo (dados fictícios)':j.maquina.nome;
 const gl0=CUR.b.slice(0);
 new T.GLTFLoader().parse(gl0,'',gl=>{const ms=[];gl.scene.traverse(o=>{if(o.isMesh)ms.push(o)});
 ms.forEach(o=>{const id=(CUR.j.agrupamento||{})[o.name]||o.name.split('__')[0];if(!F[id])F[id]={n:id,S:1,O:1,D:1,v:0,u:0,d:'',t:'',c:0,p:{}};let g=parts[id];if(!g){g=new T.Group();g.userData={id,cover:!!F[id].c};mdl.add(g);parts[id]=g}
  {const na=o.geometry.attributes.normal;let bad=!na;if(na){const q=na.array;for(let i=0;i<q.length;i++){if(!(Math.abs(q[i])<=1.0001)){bad=true;break}}}
  if(bad){o.geometry=o.geometry.toNonIndexed();o.geometry.deleteAttribute('normal');o.geometry.computeVertexNormals()}}
  g.add(o);o.castShadow=true;o.receiveShadow=true;o.material=o.userData.m0=o.material.clone();if(F[id].c&&F[id].S<9)o.material.side=T.DoubleSide});
 paintAll();document.getElementById('ld').remove();if(CUR.j.maquina.novo){CUR.j.maquina.novo=false;save()}},e=>{document.getElementById('ld').textContent='Erro ao carregar o modelo'});}catch(e){document.getElementById('ld').textContent='Erro ao carregar '+MID+': '+e.message}}setTimeout(init,0);

let CUR=null;
const DB=()=>new Promise((ok,er)=>{const r=indexedDB.open('fmea',1);r.onupgradeneeded=()=>r.result.createObjectStore('m');r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error)});
const dbop=async(m,k,v)=>{const d=await DB();return new Promise((ok,er)=>{const s=d.transaction('m',m=='r'?'readonly':'readwrite').objectStore('m');const q=m=='r'?s.get(k):m=='w'?s.put(v,k):m=='k'?s.getAllKeys():s.delete(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>er(q.error)})};
async function getM(id){const d=await dbop('r',id);if(d)return d;const j=await(await fetch(id+'.json')).json();const b=await(await fetch(j.maquina.modelo_glb||id+'.glb')).arrayBuffer();return{j,b}}
function sync(){CUR.j.pecas=Object.keys(F).map(id=>{const f=F[id];return Object.assign({},f.p||{},{id,mesh:id,nome:f.n,tipo:f.c?'cover':'interna',severidade:f.S,ocorrencia:f.O,deteccao:f.D,vida_h:f.v,usado_h:f.u,vencimento:f.d,nota:f.t})})}
const save=async()=>{sync();await dbop('w',CUR.j.maquina.id,{j:CUR.j,b:CUR.b})};
const FLD=[['n','Nome','text'],['c','Tipo: 0 interna, 1 tampa/proteção','number'],['S','Severidade (1 a 10)','number'],['O','Ocorrência (1 a 10)','number'],['D','Detecção (1 a 10)','number'],['v','Vida útil (h)','number'],['u','Horas usadas','number'],['d','Vencimento','date'],['t','Nota','text']];
const PF=[['modo_falha','Modo de falha'],['efeito','Efeito'],['causa','Causa'],['controle_atual','Controle atual'],['acao_recomendada','Ação recomendada'],['risco_seguranca','Risco de segurança']];
const LF=[['loto','Passos de bloqueio (LOTO), um por linha'],['epis','EPIs, um por linha']];
const ext=p=>!p?'':PF.filter(([k])=>p[k]).map(([k,l])=>`<div><b>${l}:</b> ${p[k]}</div>`).join('')+(p.loto&&p.loto.length?`<div><b>LOTO:</b><ol>${p.loto.map(x=>`<li>${x}</li>`).join('')}</ol></div>`:'')+(p.epis&&p.epis.length?`<div><b>EPIs:</b> ${p.epis.join(', ')}</div>`:'');
function edit(id){const f=F[id],p=f.p=f.p||{};ed.style.display='block';
 ed.innerHTML='<h3>Editar peça</h3>'+FLD.map(([k,l,t])=>`<label>${l}<input data-k="${k}" type="${t}" value="${f[k]??''}"></label>`).join('')
 +PF.map(([k,l])=>`<label>${l}<textarea data-p="${k}">${p[k]||''}</textarea></label>`).join('')
 +LF.map(([k,l])=>`<label>${l}<textarea data-l="${k}">${(p[k]||[]).join('\n')}</textarea></label>`).join('')
 +`<label>Juntar a outra peça<select id="mg"><option value="">não juntar</option>${Object.keys(F).filter(x=>x!=id).map(x=>`<option value="${x}">${F[x].n}</option>`).join('')}</select></label><button id="sv">Salvar</button><button id="cc">Cancelar</button>`;
 cc.onclick=()=>ed.style.display='none';
 sv.onclick=async()=>{ed.querySelectorAll('[data-k]').forEach(i=>{f[i.dataset.k]=i.type=='number'?+i.value:i.value});
  ed.querySelectorAll('[data-p]').forEach(i=>p[i.dataset.p]=i.value);
  ed.querySelectorAll('[data-l]').forEach(i=>p[i.dataset.l]=i.value.split('\n').map(x=>x.trim()).filter(Boolean));
  const t=mg.value;if(t){const ag=CUR.j.agrupamento=CUR.j.agrupamento||{};[...parts[id].children].forEach(m=>{parts[t].add(m);ag[m.name]=t});Object.keys(ag).forEach(k=>{if(ag[k]==id)ag[k]=t});mdl.remove(parts[id]);delete parts[id];delete F[id]}
  Object.values(parts).forEach(g=>g.traverse(o=>{if(o.isMesh)o.userData.ms=null}));
  sel=null;paintAll();show(null);ed.style.display='none';await save()}}
imp.onclick=()=>fi.click();
fi.onchange=async()=>{const f=fi.files[0];if(!f)return;const nome=prompt('Nome da máquina:',f.name.replace(/\.glb$/i,''));if(!nome)return;
 const id=nome.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'maq';
 await dbop('w',id,{j:{maquina:{id,nome,comprimento_m:2.8,dados_ficticios:false,novo:true},pecas:[],agrupamento:{}},b:await f.arrayBuffer()});location.search='?m='+id};
exp.onclick=()=>{sync();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(CUR.j,null,1)],{type:'application/json'}));a.download=MID+'.json';a.click()};
(async()=>{const ks=await dbop('k');const all=[...new Set(['cnc-01',...ks])];ms.innerHTML=all.map(k=>`<option ${k==MID?'selected':''}>${k}</option>`).join('');ms.onchange=()=>location.search='?m='+ms.value})();
dbg.onclick=()=>alert(Object.keys(parts).map(k=>k+' ('+parts[k].children.length+' malhas)').join('\n'));onresize=()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)};
</script></body></html>
