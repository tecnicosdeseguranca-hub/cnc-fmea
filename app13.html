function edit(id){const f=F[id],p=f.p=f.p||{};ed.style.display='block';
 ed.innerHTML='<h3>Editar peça</h3>'+FLD.map(([k,l,t])=>`<label>${l}<input data-k="${k}" type="${t}" value="${f[k]??''}"></label>`).join('')
 +PF.map(([k,l])=>`<label>${l}<textarea data-p="${k}">${p[k]||''}</textarea></label>`).join('')
 +LF.map(([k,l])=>`<label>${l}<textarea data-l="${k}">${(p[k]||[]).join('\n')}</textarea></label>`).join('')
 +`<label>Juntar a outra peça<select id="mg"><option value="">não juntar</option>${Object.keys(F).filter(x=>x!=id).map(x=>`<option value="${x}">${F[x].n}</option>`).join('')}</select></label><button id="sv">Salvar</button><button id="cc">Cancelar</button>`;

  const t=mg.value;if(t){const ag=CUR.j.agrupamento=CUR.j.agrupamento||{};[...parts[id].children].forEach(m=>{parts[t].add(m);ag[m.name]=t});Object.keys(ag).forEach(k=>{if(ag[k]==id)ag[k]=t});mdl.remove(parts[id]);delete parts[id];delete F[id]}
  Object.values(parts).forEach(g=>g.traverse(o=>{if(o.isMesh)o.userData.ms=o.userData.mm=o.userData.mp=null}));
  sel=null;paintAll();show(null);ed.style.display='none';await save()}}

function relPDF(){sync();const {jsPDF}=window.jspdf;const d=new jsPDF({unit:'mm',format:'a4'});const j=CUR.j,m=j.maquina,L=14;let y=18;
 const hoje=new Date();const ps=j.pecas.map(p=>Object.assign({},p,{rpn:p.severidade*p.ocorrencia*p.deteccao,pc:p.vida_h?Math.round(p.usado_h/p.vida_h*100):0,dias:p.vencimento?Math.ceil((new Date(p.vencimento)-hoje)/864e5):null})).sort((a,b)=>b.rpn-a.rpn);
 const foot=()=>{d.setFontSize(7);d.setTextColor(120);d.text('Apoio à decisão. Não substitui o procedimento oficial da empresa; revisar por profissional habilitado.',L,287);if(m.credito_modelo)d.text('Modelo 3D: '+m.credito_modelo,L,291);d.setTextColor(0)};
 const np=()=>{foot();d.addPage();y=18};
 d.setFontSize(15);d.text('Relatório de criticidade (FMEA)',L,y);y+=7;d.setFontSize(10);d.text(m.nome+' · '+hoje.toLocaleDateString('pt-BR'),L,y);y+=6;
 if(m.dados_ficticios){d.setTextColor(200,0,0);d.text('ATENÇÃO: dados fictícios de exemplo.',L,y);d.setTextColor(0);y+=6}
 const crit=ps.filter(p=>p.severidade>=9).length,venc=ps.filter(p=>p.dias!==null&&p.dias<60).length;
 d.text('Peças: '+ps.length+' · Severidade 9-10: '+crit+' · Vencidas ou a vencer em 60 dias: '+venc+' · RPN máximo: '+(ps[0]?ps[0].rpn:0),L,y);y+=8;
 d.setFontSize(9);d.setFont(undefined,'bold');d.text('Peça',L,y);d.text('S',100,y);d.text('O',110,y);d.text('D',120,y);d.text('RPN',130,y);d.text('Vida',146,y);d.text('Vencimento',166,y);d.setFont(undefined,'normal');y+=2;d.line(L,y,196,y);y+=5;
 ps.forEach(p=>{if(y>275)np();
  d.text(String(p.nome).slice(0,48),L,y);d.text(String(p.severidade),100,y);d.text(String(p.ocorrencia),110,y);d.text(String(p.deteccao),120,y);d.text(String(p.rpn),130,y);d.text(p.pc+'%',146,y);
  const v=p.vencimento?p.vencimento.split('-').reverse().join('/')+(p.dias<0?' (vencido)':p.dias<60?' (<60 d)':''):'-';if(p.dias!==null&&p.dias<60)d.setTextColor(200,0,0);d.text(v,166,y);d.setTextColor(0);y+=5.2});
 np();d.setFontSize(12);d.text('Fichas das peças críticas (S 9 a 10)',L,y);y+=8;d.setFontSize(9);
 ps.filter(p=>p.severidade>=9).forEach(p=>{const lin=[['Modo de falha',p.modo_falha],['Efeito',p.efeito],['Causa',p.causa],['Controle atual',p.controle_atual],['Ação recomendada',p.acao_recomendada],['Risco de segurança',p.risco_seguranca],['LOTO',(p.loto||[]).map((x,i)=>(i+1)+') '+x).join('\n')],['EPIs',(p.epis||[]).join(', ')]];
  if(y>240)np();d.setFont(undefined,'bold');d.text(p.nome+' (S'+p.severidade+' O'+p.ocorrencia+' D'+p.deteccao+' RPN '+p.rpn+')',L,y);d.setFont(undefined,'normal');y+=5;
  lin.forEach(([k,v])=>{const t=d.splitTextToSize(k+': '+(v||'a preencher'),178);if(y+t.length*4.2>280)np();d.text(t,L,y);y+=t.length*4.2});y+=4});
 foot();d.save(MID+'-relatorio.pdf')}

 ed.style.display='block';ed.innerHTML='<h3>QR da máquina</h3><canvas id="qc"></canvas><p style="font-size:12px;word-break:break-all">'+u+'</p><p style="font-size:12px">Máquinas importadas ficam só neste celular até existir o servidor.</p><button id="qd">Baixar PNG</button><button id="qx">Fechar</button>';
 const c=qc;c.width=W;c.height=H;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);g.fillStyle='#000';for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))g.fillRect(pad+k*s,pad+r*s,s,s);
 g.font='bold 22px sans-serif';g.textAlign='center';g.fillText(String(CUR.j.maquina.nome).slice(0,32),W/2,W+22);g.font='14px sans-serif';g.fillText('Escaneie para abrir no app FMEA',W/2,W+46);
 c.style.cssText='background:#fff;max-width:100%;border-radius:8px';
 qx.onclick=()=>ed.style.display='none';qd.onclick=()=>{const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='qr-'+MID+'.png';a.click()}};

 porta_frontal:['mesa','cabecote','carro_guias'],painel_lateral_esq:['magazine','braco_trocador','motor_magazine','suporte_magazine'],cobertura_cabecote:['cabecote'],protecao_cavacos:['carro_guias','mesa','mancais_fuso'],carenagem_externa:['cabecote','mesa','carro_guias'],painel_traseiro:['cabecote','motor_eixo']};
const IS=new T.Scene();IS.background=new T.Color(0x1a2027);IS.environment=S.environment;IS.add(new T.HemisphereLight(0xffffff,0x334455,.9));
const IL=new T.DirectionalLight(0xffffff,1.1);IL.position.set(2,3,2);IS.add(IL);
const IC=new T.PerspectiveCamera(40,1,.02,60);let IG=null,insOn=false,insIds=[],insAng=0;const insC=new T.Vector3();let insR=1;
function buildInset(){if(IG){IS.remove(IG);IG=null}if(!insOn)return;IG=new T.Group();mdl.updateMatrixWorld(true);
 insIds.forEach(id=>{const g=parts[id];if(!g)return;const c=g.clone(true);c.matrixAutoUpdate=false;c.matrix.copy(g.matrixWorld);IG.add(c)});
 IS.add(IG);IG.updateMatrixWorld(true);const b=new T.Box3().setFromObject(IG);b.getCenter(insC);insR=Math.max(.2,b.getSize(new T.Vector3()).length()*.55)}
function showInset(ids,title){insIds=(ids||[]).filter(id=>parts[id]);if(!insIds.length)return;insOn=true;ins.style.display='block';inst.textContent='Ampliação: '+title;buildInset()}
function closeInset(){insOn=false;ins.style.display='none';ins.classList.remove('big');buildInset()}
insx.onclick=e=>{e.stopPropagation();closeInset()};ins.onclick=()=>ins.classList.toggle('big');
function renderInset(){const r=ins.getBoundingClientRect();if(r.width<10||!IG)return;IC.aspect=r.width/r.height;IC.updateProjectionMatrix();insAng+=.012;
 IC.position.set(insC.x+Math.sin(insAng)*insR*1.7,insC.y+insR*.5,insC.z+Math.cos(insAng)*insR*1.7);IC.lookAt(insC);
 const H_=innerHeight;R.setViewport(r.left,H_-r.bottom,r.width,r.height);R.setScissor(r.left,H_-r.bottom,r.width,r.height);R.setScissorTest(true);R.render(IS,IC);R.setScissorTest(false);R.setViewport(0,0,innerWidth,innerHeight)}
